name: personal-ci

# Runs the personal smoke tests + scripts on the personal branch.
# Lightweight: CPU-only torch, no transformers / datasets / numpy. Should
# finish in well under a minute.

on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel keeps install under a minute.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu"
          python -m pip install pytest

      - name: Run pytest smoke suite
        run: python -m pytest tests/test_smoke.py -v

      - name: Run pytest invariant suite
        run: python -m pytest tests/test_invariants.py -v

      - name: Run quick_demo
        run: python -m scripts.quick_demo

      - name: Run sweep_loops
        run: python -m scripts.sweep_loops

      - name: Run bench_attention
        run: python -m scripts.bench_attention

      - name: Run train_copy_task
        run: python -m scripts.train_copy_task

      - name: Run depth_extrapolation
        run: python -m scripts.depth_extrapolation

      - name: Run expert_usage
        run: python -m scripts.expert_usage

      - name: Run save_load
        run: python -m scripts.save_load

      - name: Run early_exit
        run: python -m scripts.early_exit

      - name: Run loops_grad_study
        run: python -m scripts.loops_grad_study

      - name: Run extrapolate_seq_len
        run: python -m scripts.extrapolate_seq_len

      - name: Run router_collapse_check
        run: python -m scripts.router_collapse_check

      - name: Run lora_adapter_ablation
        run: python -m scripts.lora_adapter_ablation

      - name: Run kv_cache_speed
        run: python -m scripts.kv_cache_speed

      - name: Run attention_variant_compare
        run: python -m scripts.attention_variant_compare

      - name: Run router_balance_loss
        run: python -m scripts.router_balance_loss

      - name: Run seed_robustness
        run: python -m scripts.seed_robustness

      - name: Run cosine_lr_warmup
        run: python -m scripts.cosine_lr_warmup

      - name: Run weight_decay_ablation
        run: python -m scripts.weight_decay_ablation

      - name: Run grad_clip_ablation
        run: python -m scripts.grad_clip_ablation

      - name: Run batch_size_curve
        run: python -m scripts.batch_size_curve

      - name: Run model_size_scaling
        run: python -m scripts.model_size_scaling

      - name: Run eval_helper_smoke
        run: python -m scripts.eval_helper_smoke

      - name: Run parity_loop_sweep
        run: python -m scripts.parity_loop_sweep

      - name: Run sort3_loop_sweep
        run: python -m scripts.sort3_loop_sweep

      - name: Run lr_peak_curve
        run: python -m scripts.lr_peak_curve

      - name: Run topk_experts_sweep
        run: python -m scripts.topk_experts_sweep

      - name: Run shared_expert_ablation
        run: python -m scripts.shared_expert_ablation

      - name: Run init_seed_variance
        run: python -m scripts.init_seed_variance

      - name: Run longer_training
        run: python -m scripts.longer_training

      - name: Run recurrent_vs_stacked
        run: python -m scripts.recurrent_vs_stacked

      - name: Run prelude_coda_depth
        run: python -m scripts.prelude_coda_depth

      - name: Run mla_kv_rank_sweep
        run: python -m scripts.mla_kv_rank_sweep

      - name: Run expert_count_sweep
        run: python -m scripts.expert_count_sweep

      - name: Run loops_at_long_train
        run: python -m scripts.loops_at_long_train

      - name: Run loops_at_optimal_arch
        run: python -m scripts.loops_at_optimal_arch

      - name: Run loops_at_optimal_arch_long
        run: python -m scripts.loops_at_optimal_arch_long

      - name: Run convergence_curve
        run: python -m scripts.convergence_curve

      - name: Run task_difficulty_scaling
        run: python -m scripts.task_difficulty_scaling

      - name: Run loops_at_hard_task
        run: python -m scripts.loops_at_hard_task

      - name: Run profile_trace
        run: python -m scripts.profile_trace
